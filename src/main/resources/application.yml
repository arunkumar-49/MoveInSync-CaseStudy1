server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moveinsync?timezone=UTC
    username: admin
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

resilience4j:
  circuitbreaker:
    instances:
      routingService:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3